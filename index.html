<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pokémon</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<header class="bg-danger border-bottom border-dark border-4 py-3 mb-5 shadow">
    <div class="container">
        <div class="row align-items-center g-3">
            <div class="col-md-auto text-center">
                <h1 class="mb-0">
                    <img src="img/logo.png" alt="Buscador de Pokémon" height="80">
                </h1>
            </div>
            <div class="col-md ms-md-auto" style="max-width: 600px;">
                <label for="pokemonId" class="visually-hidden">Buscar Pokémon por nombre o ID</label>
                <div class="input-group input-group-lg shadow">
                    <input id="pokemonId" type="text" class="form-control border-0"
                           placeholder="Ingrese un nombre o ID" autocomplete="off">
                    <button id="btnBuscar" type="button" class="btn btn-warning fw-bold px-4">Buscar</button>
                    <button id="btnVolver" type="button" class="btn btn-light fw-bold px-3">Volver</button>

                </div>
            </div>
        </div>
    </div>
</header>

    <main class="container">

        <div id="spinner" class="text-center my-5 d-none">
            <div class="spinner-border text-dark" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando Pokémon...</p>
        </div>

        <div id="mensaje" aria-live="polite"></div>

        <div id="resultado" class="row g-4 mb-5"></div>
    </main>

    <footer class="border-top py-3 text-center text-muted small">
        Datos de <a href="https://pokeapi.co" target="_blank" rel="noopener" class="link-dark fw-bold">PokeAPI</a>
    </footer>

    <!-- JAVASCRIPT -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
